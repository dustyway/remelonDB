name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build codebase-guide EPUB
        uses: docker://pandoc/core:3.10
        with:
          args: >-
            docs/codebase-guide.md
            -o remelondb-guide.epub
            --toc --toc-depth=2 -N
            --resource-path=docs
            --css docs/codebase-guide.epub.css
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Validate codebase-guide EPUB
        run: |
          curl -fsSLO https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q epubcheck-5.3.0.zip
          java -jar epubcheck-5.3.0/epubcheck.jar remelondb-guide.epub
      - run: npx typedoc
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
